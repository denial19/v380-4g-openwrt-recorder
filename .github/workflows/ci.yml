name: CI / synthetic protocol tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pycryptodome
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Synthetic muxing/decryption tests
        run: python -m unittest discover -s tests -v
      - name: Scan repository for obvious embedded credentials
        run: python scripts/security_audit.py --public-only
